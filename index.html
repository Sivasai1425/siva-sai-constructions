<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Siva Sai Constructions</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;font-family:Arial;color:#111827}.app{max-width:760px;margin:auto;background:#fff;min-height:100vh}.head{background:#111827;color:#fff;padding:22px 18px}.head h1{margin:0;font-size:22px}.head p{margin:5px 0;font-size:13px;opacity:.8}.content{padding:15px}.nav{display:flex;gap:7px;overflow:auto}.nav button{white-space:nowrap}button{min-height:44px;padding:10px 13px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-weight:700}button.primary{width:100%;background:#111827;color:white;border:0}.page{display:none}.page.on{display:block}.section{font-size:18px;font-weight:900;margin:18px 0 9px}.sub,.muted{font-size:12px;color:#6b7280}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;font-weight:800;display:block;margin:8px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}textarea{min-height:85px}.card{border:1px solid #e1e4e8;border-radius:15px;padding:14px;margin:10px 0}.soft{background:#f7f7f8}.price{font-size:28px;font-weight:900}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #e5e7eb;font-size:13px}.row:last-child{border:0}.warn{border-left:4px solid #9ca3af}.list{padding-left:18px;font-size:13px;line-height:1.5}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="head"><h1>SIVA SAI CONSTRUCTIONS</h1><p>We Build Your Dreams • House Design Studio</p></header><main class="content"><nav class="nav"><button data-p="project">Project</button><button data-p="plans">Plans</button><button data-p="design">Design</button><button data-p="boq">BOQ & Cost</button><button data-p="3d">3D Prompts</button></nav>

<section id="project" class="page on"><div class="section">Complete House Design Input</div><div class="sub">Missing information stays marked as an assumption. Enter the project details first.</div><div class="grid">
<div><label>Plot width (ft)</label><input id="w" type="number" placeholder="30"></div><div><label>Plot length (ft)</label><input id="l" type="number" placeholder="50"></div>
<div><label>Location / area</label><input id="city" placeholder="Visakhapatnam"></div><div><label>Road width (ft)</label><input id="road" type="number" placeholder="30"></div>
<div><label>Road direction</label><select id="rd"><option>North</option><option>South</option><option>East</option><option>West</option></select></div><div><label>Plot orientation</label><select id="ori"><option>North-facing</option><option>South-facing</option><option>East-facing</option><option>West-facing</option></select></div>
<div><label>Floors</label><select id="fl"><option>Ground + 1</option><option>Ground only</option><option>Ground + 2</option><option>Ground + 3</option></select></div><div><label>Bedrooms</label><select id="bed"><option>2 BHK</option><option>3 BHK</option><option>4 BHK</option></select></div>
<div><label>Parking</label><select id="park"><option>1 Car</option><option>2 Cars</option><option>1 Car + 2 Wheelers</option><option>2 Cars + 2 Wheelers</option></select></div><div><label>Budget ₹</label><input id="budget" type="number" placeholder="2500000"></div>
<div><label>Vastu</label><select id="vastu"><option>Yes</option><option>No</option><option>Preferences only</option></select></div><div><label>Style</label><select id="style"><option>Modern Indian contemporary</option><option>Minimal modern</option><option>Contemporary premium</option><option>Traditional-modern fusion</option></select></div>
<div class="full"><label>Family requirements</label><textarea id="family" placeholder="Parents bedroom on ground floor, pooja, WFH, utility, etc."></textarea></div></div><button class="primary" id="gen">Generate Complete Proposal</button><div id="sum" class="card soft"></div></section>

<section id="plans" class="page"><div class="section">Plot, Site & Floor Planning</div><div id="plansOut" class="card"></div></section>
<section id="design" class="page"><div class="section">Elevation, Interior, Electrical & Plumbing</div><div id="designOut" class="card"></div></section>
<section id="boq" class="page"><div class="section">Preliminary BOQ & Cost</div><div id="boqOut" class="card"></div></section>
<section id="3d" class="page"><div class="section">3D Visualization Prompts</div><div id="pOut"></div></section>
</main></div><script>
(()=>{const $=x=>document.getElementById(x),money=n=>'₹'+Math.round(n).toLocaleString('en-IN');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$(b.dataset.p).classList.add('on');scrollTo(0,0)});
function gen(){let w=+$('w').value||0,l=+$('l').value||0,a=w*l,city=$('city').value||'Not specified',road=$('road').value||'Not specified',rate=2000,total=a*rate,budget=+$('budget').value||0;
$('sum').innerHTML='<b>Project Summary</b><div class="row"><span>Plot</span><b>'+(a?(w+' × '+l+' ft = '+a.toLocaleString('en-IN')+' sq ft'):'Not specified')+'</b></div><div class="row"><span>Location</span><b>'+city+'</b></div><div class="row"><span>Road / orientation</span><b>'+road+' ft • '+$('rd').value+' • '+$('ori').value+'</b></div><div class="row"><span>Floors / bedrooms</span><b>'+$('fl').value+' • '+$('bed').value+'</b></div><div class="row"><span>Parking / Vastu</span><b>'+$('park').value+' • '+$('vastu').value+'</b></div><div class="row"><span>Budget</span><b>'+(budget?money(budget):'Not specified')+'</b></div><div class="row"><span>Placeholder planning cost</span><b>'+(a?money(total):'Needs dimensions')+'</b></div><p class="muted">Placeholder rate ₹2,000/sq ft. Replace with your company rate book before client quotation.</p>';
$('plansOut').innerHTML='<h3>1. Plot Analysis</h3><ul class="list"><li>Plot area: '+(a?a.toLocaleString('en-IN')+' sq ft':'Not specified')+'.</li><li>Road: '+$('rd').value+', '+road+' ft.</li><li>Indicative planning footprint: '+(a?Math.round(a*.70).toLocaleString('en-IN')+' sq ft':'about 70% of plot area')+'. Exact setbacks/coverage require local authority verification.</li></ul><h3>2. Site Plan</h3><p class="small">Arrange building footprint, front parking/entrance, side/rear light and ventilation, service area, rainwater harvesting, sump and wastewater/sewer facilities. Avoid placing tanks or heavy loads without structural review.</p><h3>3. Floor Plan</h3><p class="small">Optimize living/dining, bedrooms, kitchen, toilets, pooja, utility and stairs around daylight, cross-ventilation and minimal corridors. Stack toilets and wet areas vertically where possible.</p><h3>4. Vastu</h3><p class="small">'+$('vastu').value+' requested. Vastu is a planning preference and does not replace structural, fire, sanitation, accessibility or development requirements.</p><h3>5. Staircase</h3><p class="small">Concept width about 3–3.5 ft for a typical home; final riser, tread, landing and headroom must follow applicable code and actual floor height.</p>';
$('designOut').innerHTML='<h3>Front Elevation</h3><p class="small">'+$('style').value+' with practical RCC geometry, selective HPL/stone accents, balcony/pergola where useful, aluminium/uPVC windows, compound wall/gate and economical exterior lighting.</p><h3>Material Palette</h3><div class="row"><span>Economical</span><b>Vitrified tile • exterior paint • uPVC • laminate</b></div><div class="row"><span>Mid-range</span><b>Large-format tile • HPL • powder-coated aluminium</b></div><div class="row"><span>Premium</span><b>Engineered/natural stone • premium sanitaryware • designer lighting</b></div><h3>Interiors</h3><p class="small">Living: compact sofa/TV/storage. Dining: 4–6 seats. Kitchen: L/U/parallel layout with tall unit, chimney, RO and appliance niches. Bedrooms: correctly scaled bed, wardrobe and study. Bathrooms: dry/wet zoning. Include under-stair storage, lofts and shoe cabinet.</p><h3>Lighting</h3><p class="small">Ambient downlights, kitchen task lights, mirror lights, selective cove lighting, stair lighting, exterior/gate lights and low-maintenance garden lights.</p><h3>Electrical</h3><p class="small">Plan dedicated points for ACs, geysers, fridge, microwave, chimney, RO, washing machine, TV/data, Wi-Fi, CCTV, doorbell and EV charging. Final load/DB design requires an electrical professional.</p><h3>Plumbing</h3><p class="small">Minimize pipe lengths and bends, align wet areas, provide cleanouts/inspection chambers, separate rainwater drainage and allow access for tank/pump maintenance.</p><h3>Landscape</h3><p class="small">Use pavers, hardy plants, one suitable feature tree where space permits, vertical planting only where maintainable.</p>';
let heads=[['Foundation/site work',.12],['RCC + reinforcement',.24],['Masonry + plaster',.14],['Flooring + tiling',.12],['Doors + windows',.10],['Electrical',.08],['Plumbing + sanitary',.09],['Painting + finishes',.07],['Contingency/misc.',.04]];
$('boqOut').innerHTML=(a?'<div class="price">'+money(total)+'</div><div class="muted">Planning allowance only</div>':'Enter plot dimensions first')+heads.map(x=>'<div class="row"><span>'+x[0]+'</span><b>'+(a?money(total*x[1]):'—')+'</b></div>').join('')+'<h3>Quantity Framework</h3><ul class="list"><li>Excavation/PCC/RCC and steel: final structural drawings.</li><li>Block/brick/plaster/paint: measured wall and opening areas.</li><li>Flooring: room-wise area plus approved wastage.</li><li>Doors/windows: opening schedule with sizes/material/hardware.</li><li>Electrical/plumbing: point schedule and measured circuits/pipe runs.</li><li>Kitchen, elevation, compound wall and landscaping: separate detailed scope.</li></ul><div class="card warn muted">Not a tender BOQ or structural design. Do not procure from these placeholder figures.</div>';
let base='Realistic Indian residential architecture for Siva Sai Constructions, '+$('style').value+', '+(w&&l?(w+' ft × '+l+' ft'):'specified plot')+', '+$('fl').value+', '+$('bed').value+', '+$('ori').value+', '+city+', practical RCC framed construction, physically plausible proportions, realistic materials and furniture, accurate circulation, daylight and 4K architectural visualization';
let ps=['Front elevation render','Living room render','Kitchen render','Master bedroom render','Bedroom render','Bathroom render','Staircase render','Night exterior render','Aerial house render'];
$('pOut').innerHTML=ps.map((x,i)=>'<div class="card"><b>'+x+'</b><p class="small">'+base+', '+['modern facade, parking, gate, balcony and landscape, no impossible cantilevers','realistic sofa, TV wall, dining connection and layered lighting','practical modular kitchen, chimney, RO, tall storage and appliance niches','king bed, wardrobe, bedside tables and compact study','correctly scaled bed, wardrobe, study and natural ventilation','dry/wet zones, vanity, sanitaryware, exhaust and concealed services','safe RCC stair proportions, handrail, daylight and under-stair storage','warm exterior lighting, gate, compound wall and landscape lights','three-quarter aerial view showing terrace, site circulation, parking and open spaces'][i]+'.</p></div>').join('');
}
$('gen').onclick=gen;gen();})();
</script></body></html>
